<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#231E1A" />
    <title>Atualizar BIPTAG</title>
    <link rel="icon" href="/icons/biptag-logo-192.png" />
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:#f4efe7;color:#292520;font-family:system-ui,sans-serif}main{width:min(440px,100%);padding:28px 22px;border:1px solid #dfd2c3;border-radius:22px;background:#fffdf9}img{width:56px;height:56px;border-radius:14px}h1{margin:18px 0 12px;font-size:28px}p{color:#756b60;font-size:15px;line-height:1.6}button,a{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;padding:12px 16px;border-radius:12px;font:700 15px system-ui;text-align:center;text-decoration:none}button{margin:20px 0 10px;border:0;background:#b85e30;color:white;cursor:pointer}button:disabled{opacity:.65;cursor:wait}a{color:#795b41;border:1px solid #dfd2c3;background:transparent}#status{overflow-wrap:anywhere}small{display:block;color:#756b60;line-height:1.6;overflow-wrap:anywhere}
    </style>
    <script src="/update-app.js" defer></script>
  </head>
  <body>
    <main>
      <img src="/icons/biptag-logo-192.png" alt="BIPTAG" />
      <h1>Atualizar aplicativo</h1>
      <p>Carregue a versão mais recente mantendo as auditorias salvas neste aparelho e as permissões dos leitores.</p>
      <p id="status" role="status" aria-live="polite">Confira que a leitura atual foi salva antes de continuar. É necessário ter internet.</p>
      <button id="update-button" type="button">Atualizar agora</button>
      <a href="/">Voltar ao BIPTAG</a>
      <small id="version"></small>
    </main>
  </body>
</html>
